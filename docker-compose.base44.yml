# Base44 sandbox / development stack.
#
# Runs the app FROM THE CLONED SOURCE with live reload, so edits in client/ and
# server/ appear without rebuilding an image:
#   web : Vite dev server  -> host port 3000 (the preview entry point)
#   api : Express API      -> internal port 8000, node --watch
#   db  : PostgreSQL 16    -> schema loaded from server/db/init.sql on first boot
#
# Single-origin wiring: the browser only ever talks to port 3000; Vite proxies
# /api to the api service (see client/vite.config.js), so no CORS setup is needed.
#
# The Postgres credentials below are LOCAL INFRASTRUCTURE credentials generated
# for this sandbox — they are not user secrets and never leave the compose file.
# This app needs no external-service credentials.

name: shivanshos-app

services:
  db:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=app_dev_password
      - POSTGRES_DB=app
    volumes:
      - db_data:/var/lib/postgresql/data
      # Only runs on an empty data volume; see AGENTS.md before changing the schema.
      - ./server/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    image: node:22
    restart: on-failure
    working_dir: /app
    environment:
      - NODE_ENV=development
      - PORT=8000
      - DATABASE_URL=postgres://app:app_dev_password@db:5432/app
      # Platform-provided flag; only "1" enables sandbox-only behavior.
      - BASE44_PREVIEW_MODE
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && exec npm run dev"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    image: node:22
    restart: on-failure
    working_dir: /app
    environment:
      - NODE_ENV=development
      # Vite (>=6.1) appends this platform-provided list to server.allowedHosts.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_PREVIEW_MODE
      # Used by vite.config.js to allow the sandbox preview host (sandbox-only).
      - BASE44_SANDBOX_HOST_DOMAIN
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0 --port 5173"]
    ports:
      - "3000:5173"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  db_data:
  server_node_modules:
  client_node_modules:
